name: flutter_zpl_printer
description: "Print to Zebra label printers from Flutter over Bluetooth LE, Wi-Fi, or USB. Send ZPL, check printer status, build labels with flutter_zpl_generator. No Link-OS SDK."
version: 0.2.0
homepage: https://github.com/minhtri1401/flutter_zpl_printer
repository: https://github.com/minhtri1401/flutter_zpl_printer
issue_tracker: https://github.com/minhtri1401/flutter_zpl_printer/issues
documentation: https://github.com/minhtri1401/flutter_zpl_printer/blob/main/GUIDE.md
topics:
  - zebra
  - zpl
  - printer
  - labels
  - bluetooth

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^2.3.0
  flutter_zpl_generator: ^2.2.0
  image: ^4.8.0
  archive: ^4.0.0
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  pigeon: ^22.7.4
  ffigen: ^14.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_zpl_printer
        pluginClass: FlutterZplPrinterPlugin
      ios:
        pluginClass: FlutterZplPrinterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterZplPrinterPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterZplPrinterPluginCApi
