name: flutter_zpl_printer
description: "Discover, connect to, and print on Zebra ZPL label printers over Bluetooth LE, Wi-Fi/TCP, and USB. Pure-Dart protocol stack, no Link-OS SDK required."
version: 0.1.0
homepage: https://github.com/minhtri1401/flutter_zpl_printer
repository: https://github.com/minhtri1401/flutter_zpl_printer
issue_tracker: https://github.com/minhtri1401/flutter_zpl_printer/issues
topics:
  - zebra
  - zpl
  - printer
  - bluetooth
  - usb

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^1.2.0
  image: ^4.8.0
  archive: ^4.0.0
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  pigeon: ^22.7.4
  ffigen: ^14.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_zpl_printer
        pluginClass: FlutterZplPrinterPlugin
      ios:
        pluginClass: FlutterZplPrinterPlugin
      macos:
        pluginClass: FlutterZplPrinterPlugin
      windows:
        pluginClass: FlutterZplPrinterPluginCApi
