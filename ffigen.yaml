name: LibUsb
description: |
  FFI bindings for libusb 1.0.29. Committed to the repo; regenerated manually
  on libusb version bumps via `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/platform/libusb_bindings.g.dart'
headers:
  entry-points:
    - 'third_party/libusb/1.0.29/libusb.h'
preamble: |
  // ignore_for_file: type=lint, unused_field, unused_element, non_constant_identifier_names
  // GENERATED by ffigen — do not edit. Source: libusb-1.0.29
comments:
  style: doxygen
  length: brief
functions:
  include:
    - 'libusb_init'
    - 'libusb_init_context'
    - 'libusb_exit'
    - 'libusb_get_device_list'
    - 'libusb_free_device_list'
    - 'libusb_ref_device'
    - 'libusb_unref_device'
    - 'libusb_get_device_descriptor'
    - 'libusb_get_active_config_descriptor'
    - 'libusb_get_config_descriptor'
    - 'libusb_free_config_descriptor'
    - 'libusb_open'
    - 'libusb_wrap_sys_device'
    - 'libusb_close'
    - 'libusb_set_auto_detach_kernel_driver'
    - 'libusb_kernel_driver_active'
    - 'libusb_detach_kernel_driver'
    - 'libusb_claim_interface'
    - 'libusb_release_interface'
    - 'libusb_bulk_transfer'
    - 'libusb_control_transfer'
    - 'libusb_clear_halt'
    - 'libusb_reset_device'
    - 'libusb_get_string_descriptor_ascii'
    - 'libusb_error_name'
    - 'libusb_strerror'
    - 'libusb_get_device_address'
    - 'libusb_get_bus_number'
structs:
  include:
    - 'libusb_device_descriptor'
    - 'libusb_endpoint_descriptor'
    - 'libusb_interface_descriptor'
    - 'libusb_interface'
    - 'libusb_config_descriptor'
enums:
  include:
    - 'libusb_error'
    - 'libusb_transfer_type'
    - 'libusb_endpoint_direction'
    - 'libusb_class_code'
    - 'libusb_descriptor_type'
    - 'libusb_standard_request'
    - 'libusb_request_type'
    - 'libusb_request_recipient'
silence-enum-warning: true
macros:
  exclude:
    - '.*'
